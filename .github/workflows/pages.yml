name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test
      - name: Site samenstellen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png js .nojekyll _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js
          grep -q "eenhoorn-${GITHUB_SHA::7}" _site/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
